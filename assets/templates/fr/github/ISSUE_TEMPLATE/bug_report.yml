name: Bug
description: Quelque chose ne marche pas comme prévu
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: Que s'est-il passé ?
      description: Une description claire et concise du bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir '...'
        2. Cliquer sur '...'
        3. Voir l'erreur
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce qui aurait dû se passer.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "macOS 26, Chrome 140, v1.2.0"
  - type: textarea
    id: logs
    attributes:
      label: Journaux ou captures
      description: Coller la sortie d'erreur ou glisser des captures d'écran.
      render: shell
