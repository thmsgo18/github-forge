# Tauri app whose code lives in a subfolder (APP below, here "app"): React/TypeScript interface
# in app/, Rust backend in app/src-tauri/. Two jobs: pass both names to protect-main.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  front:
    # Required check name: keep it once main is protected.
    name: Interface (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm test --if-present
      - run: npm run build --if-present

  rust:
    # Required check name: keep it once main is protected.
    name: Backend Rust (tests, clippy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # generate_context! needs the built interface folder to exist.
      - run: mkdir -p app/dist
      - name: Test
        run: cargo test --locked
        working-directory: app/src-tauri
      - name: Lint
        # CI runs on Linux: items used only under #[cfg(target_os = "macos")] need the same cfg.
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri
