name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    # Keep this name: branch protection requires a check called "CI".
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Lint
        # CI runs on Linux: code behind #[cfg(target_os = "macos")] is not compiled here,
        # so items used only there must carry the same cfg or clippy reports them unused.
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
